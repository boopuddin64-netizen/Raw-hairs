name: Phase 1 validation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - development/phase-1-firebase-foundation

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
