name: Driver portal validation

on:
  pull_request:
    branches:
      - feature/driver-portal-phases-0-3
  push:
    branches:
      - feature/driver-portal-phases-0-3
      - fix/driver-portal-phase-4-6-hardening

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run automated tests
        run: npm test
      - name: Build production frontend
        run: npm run build
